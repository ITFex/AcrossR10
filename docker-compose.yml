services:
  postgres:
    image: postgres:16-alpine
    container_name: acrossr10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: acrossr10-keycloak
    restart: unless-stopped
    # start-dev is for development only; use 'start' with TLS for production
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/keycloak"
      KC_HOSTNAME: "https://wideride.de/keycloak"
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - bikeracer

  app:
    build: .
    container_name: acrossr10
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - AUTH_SECRET=${AUTH_SECRET}
      - KEYCLOAK_ID=${KEYCLOAK_ID}
      - KEYCLOAK_SECRET=${KEYCLOAK_SECRET}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - DB_PATH=/data/progress.db
    volumes:
      - acrossr10_data:/data
    ports:
      - "3001:3001"
    depends_on:
      - keycloak
    networks:
      - default
      - bikeracer

networks:
  bikeracer:
    external: true
    name: bikeracer_bikeracer-network

volumes:
  postgres_data:
  acrossr10_data:
