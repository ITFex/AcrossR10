services:
  postgres:
    image: postgres:16-alpine
    container_name: acrossr10-postgres
    restart: unless-stopped
    ports:
      - '5437:5432'
    environment:
      POSTGRES_DB: acrossr10
      POSTGRES_USER: acrossr10
      POSTGRES_PASSWORD: acrossr10
    volumes:
      - acrossr10_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  acrossr10_pgdata:
