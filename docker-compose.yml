services:
  app:
    build: .
    container_name: acrossr10
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: acrossr10-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
